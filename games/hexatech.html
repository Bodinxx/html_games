<!--
    CATEGORY: Games
    DESCRIPTION: HexaTech is a futuristic hex-card shedding game with up to 7 AI opponents, advanced Tech cards, and scalable single-round or points-target play.
    TAGS: Card Game, Strategy, AI Opponent, Hexagon, Cyberpunk
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HexaTech</title>
  <style>
    :root {
      --bg: #060a14;
      --panel: #0f1728;
      --panel-2: #151e33;
      --text: #edf3ff;
      --muted: #8fa1c8;
      --border: #26314f;
      --accent: #00f3ff;
      --danger: #ff4e87;
      --ok: #44f59f;
      --c: #00f3ff;
      --m: #ff4ecf;
      --y: #ffd44d;
      --g: #59ff89;
      --w: #f7f7ff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #101b33, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    #setup-screen, #modal-layer {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 17, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 30;
    }

    .panel {
      width: min(760px, 100%);
      background: linear-gradient(180deg, rgba(17, 29, 52, 0.96), rgba(10, 16, 30, 0.96));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 0 24px rgba(0, 243, 255, 0.15);
    }

    h1, h2, h3, p { margin: 0; }
    .title { font-size: clamp(1.4rem, 2.5vw, 2.1rem); letter-spacing: 0.08em; font-weight: 900; }
    .subtitle { color: var(--muted); margin-top: 4px; margin-bottom: 12px; font-size: 0.9rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .field {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: rgba(11, 19, 36, 0.85);
    }

    label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
    input, select {
      width: 100%;
      border: 1px solid #2e3e62;
      border-radius: 8px;
      padding: 9px 10px;
      background: #0d1730;
      color: var(--text);
      font-weight: 600;
    }

    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: #1d2a49;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s ease;
    }

    button:hover:enabled { transform: translateY(-1px); filter: brightness(1.12); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .primary { background: linear-gradient(135deg, #00b4ff, #4667ff); }
    .danger { background: linear-gradient(135deg, #a0294c, #db4f78); }

    #game {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      gap: 8px;
      padding: 10px;
    }

    #topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(11, 17, 32, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
    }

    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.78rem;
      color: var(--muted);
      background: rgba(18, 27, 47, 0.7);
      white-space: nowrap;
    }

    #arena {
      display: grid;
      grid-template-columns: 1fr minmax(250px, 360px) 1fr;
      gap: 10px;
      min-height: 0;
    }

    #opponents {
      grid-column: 1 / 4;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      align-content: start;
      min-height: 80px;
    }

    .player-chip {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(16, 23, 41, 0.9);
      padding: 8px;
      min-height: 74px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .player-chip.active { border-color: #63ffae; box-shadow: 0 0 16px rgba(76, 255, 160, 0.2); }
    .player-chip .name { font-weight: 800; font-size: 0.84rem; }
    .player-chip .meta { color: var(--muted); font-size: 0.74rem; }

    #center {
      grid-column: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-content: center;
      justify-items: center;
    }

    .stack {
      width: 130px;
      min-height: 188px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(9, 14, 26, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      padding: 8px;
    }

    .stack .count { color: var(--muted); font-size: 0.78rem; }

    #hand-wrap {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(10, 16, 30, 0.84);
      padding: 8px;
      overflow-x: auto;
      white-space: nowrap;
      min-height: 210px;
    }

    #hand { display: inline-flex; gap: 8px; align-items: center; min-height: 190px; }

    .card-btn {
      border: 1px solid transparent;
      background: transparent;
      padding: 2px;
      border-radius: 12px;
    }

    .card-btn.unplayable { opacity: 0.36; }
    .card-btn.playable:hover { transform: translateY(-6px); }

    .hex-svg { width: 108px; height: 122px; display: block; }

    #bottom {
      display: grid;
      grid-template-columns: 1fr 290px;
      gap: 8px;
      min-height: 0;
    }

    #log {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(11, 19, 36, 0.82);
      padding: 8px;
      overflow-y: auto;
      max-height: 120px;
      font-size: 0.8rem;
      color: #d4def3;
    }

    #controls {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(12, 21, 37, 0.88);
      padding: 8px;
      display: grid;
      gap: 6px;
      align-content: start;
    }

    .small { font-size: 0.78rem; color: var(--muted); }

    .modal {
      width: min(500px, 96vw);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(180deg, #121d36, #0b1224);
      padding: 14px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.18);
    }

    #color-choices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .color-pick { height: 48px; border-radius: 8px; font-weight: 800; }

    .countdown { color: #ffc75d; font-weight: 800; }

    @media (max-width: 920px) {
      #arena { grid-template-columns: 1fr; }
      #opponents { grid-column: 1; }
      #center { grid-column: 1; }
      #bottom { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="setup-screen">
    <div class="panel">
      <h1 class="title">HEXATECH // LAUNCH CONFIGURATION TERMINAL</h1>
      <p class="subtitle">Quantum hex-card shedding. Human player index = 0.</p>
      <div class="grid">
        <div class="field">
          <label for="handle">Handle</label>
          <input id="handle" maxlength="20" />
        </div>
        <div class="field">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="easy">EASY</option>
            <option value="medium" selected>MEDIUM</option>
            <option value="hard">HARD</option>
          </select>
        </div>
        <div class="field">
          <label for="opponent-count">Opponent Count (1-7)</label>
          <input id="opponent-count" type="number" min="1" max="7" value="3" />
        </div>
        <div class="field">
          <label for="win-condition">Win Condition</label>
          <select id="win-condition">
            <option value="single">Single Round</option>
            <option value="points" selected>Points Target</option>
          </select>
        </div>
        <div class="field">
          <label for="points-target">Points Target</label>
          <select id="points-target">
            <option value="250">250</option>
            <option value="500" selected>500</option>
            <option value="1000">1000</option>
          </select>
        </div>
        <div class="field">
          <label for="palette">Color Palette</label>
          <select id="palette">
            <option value="cyber">Cyber</option>
            <option value="violet">Violet</option>
            <option value="emerald">Emerald</option>
            <option value="mono">Mono</option>
          </select>
        </div>
      </div>
      <p id="profile-stats" class="small" style="margin-top:10px"></p>
      <div class="actions">
        <button id="start-btn" class="primary">Start Match</button>
        <button id="load-btn">Resume Save</button>
        <button id="reset-scores-btn" class="danger">Reset High Scores</button>
      </div>
    </div>
  </div>

  <div id="modal-layer" class="hidden"></div>

  <main id="game" class="hidden">
    <header id="topbar">
      <div>
        <h2 style="font-size:1.1rem">HEXATECH CORE</h2>
        <p class="small" id="status-line">Boot sequence complete.</p>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end">
        <div class="pill" id="active-pill">Active: -</div>
        <div class="pill" id="turn-pill">Turn: -</div>
        <div class="pill" id="round-pill">Round: 1</div>
      </div>
    </header>

    <section id="arena">
      <div id="opponents"></div>
      <div id="center">
        <div class="stack">
          <div class="small">DRAW PILE</div>
          <button id="draw-btn">Draw</button>
          <div class="count" id="draw-count">0 cards</div>
        </div>
        <div class="stack">
          <div class="small">DISCARD</div>
          <div id="discard-card"></div>
          <div class="count" id="discard-meta">-</div>
        </div>
      </div>
    </section>

    <section id="hand-wrap">
      <h3 style="font-size:0.85rem; margin-bottom:8px">YOUR HAND</h3>
      <div id="hand"></div>
    </section>

    <section id="bottom">
      <div id="log"></div>
      <div id="controls">
        <button id="play-drawn-btn" disabled>Play Drawn Card</button>
        <button id="pass-btn" disabled>Pass Turn</button>
        <button id="save-btn">Save Match</button>
        <button id="new-match-btn">New Match</button>
        <div class="small" id="leaderboard-summary">Leaderboard will appear after first round.</div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const STORAGE_KEYS = {
        profile: 'hexatech_user_profile',
        save: 'hexatech_game_save',
        highs: 'hexatech_high_scores'
      };

      const COLOR_META = {
        C: { name: 'Cyan', css: 'var(--c)' },
        M: { name: 'Magenta', css: 'var(--m)' },
        Y: { name: 'Yellow', css: 'var(--y)' },
        G: { name: 'Green', css: 'var(--g)' },
        W: { name: 'White', css: 'var(--w)' }
      };

      const SCORE_MAP = { UT: 20, BL: 20, P2: 20, MR: 40, FZ: 30, GF: 25, VT: 50, PL: 40, MG: 50, SP: 35, CH: 60 };
      const WILD_CODES = new Set(['MR', 'VT', 'PL', 'MG', 'SP', 'CH']);
      const PENALTY_CODES = new Set(['P2', 'FZ', 'MG']);
      const SHUFFLE_PASSES = 3;
      const INITIAL_HAND_SIZE = 7;
      const EASY_DRAW_PLAY_PROBABILITY = 0.45;
      const STANDARD_DRAW_PLAY_PROBABILITY = 0.9;
      const MIRROR_REACTION_SECONDS = 3;
      const SPY_VIEW_DURATION_MS = 5000;
      const MAX_REFLECTION_CHAIN_BUFFER = 2;
      const STATE = {
        STATE_GAME_INIT: 'STATE_GAME_INIT',
        STATE_CHOOSE_TURN: 'STATE_CHOOSE_TURN',
        STATE_PLAYER_TURN: 'STATE_PLAYER_TURN',
        STATE_AI_TURN: 'STATE_AI_TURN',
        STATE_APPLY_CARD_FX: 'STATE_APPLY_CARD_FX',
        STATE_EVALUATE_OPTIONS: 'STATE_EVALUATE_OPTIONS',
        STATE_CHECK_VICTORY: 'STATE_CHECK_VICTORY',
        STATE_ROUND_OVER: 'STATE_ROUND_OVER'
      };

      const ui = {
        setup: document.getElementById('setup-screen'),
        game: document.getElementById('game'),
        modalLayer: document.getElementById('modal-layer'),
        startBtn: document.getElementById('start-btn'),
        loadBtn: document.getElementById('load-btn'),
        resetScoresBtn: document.getElementById('reset-scores-btn'),
        drawBtn: document.getElementById('draw-btn'),
        passBtn: document.getElementById('pass-btn'),
        playDrawnBtn: document.getElementById('play-drawn-btn'),
        saveBtn: document.getElementById('save-btn'),
        newMatchBtn: document.getElementById('new-match-btn'),
        opponents: document.getElementById('opponents'),
        hand: document.getElementById('hand'),
        drawCount: document.getElementById('draw-count'),
        discardCard: document.getElementById('discard-card'),
        discardMeta: document.getElementById('discard-meta'),
        log: document.getElementById('log'),
        activePill: document.getElementById('active-pill'),
        turnPill: document.getElementById('turn-pill'),
        roundPill: document.getElementById('round-pill'),
        statusLine: document.getElementById('status-line'),
        leaderboardSummary: document.getElementById('leaderboard-summary'),
        profileStats: document.getElementById('profile-stats'),
        fields: {
          handle: document.getElementById('handle'),
          difficulty: document.getElementById('difficulty'),
          opponents: document.getElementById('opponent-count'),
          winCondition: document.getElementById('win-condition'),
          pointsTarget: document.getElementById('points-target'),
          palette: document.getElementById('palette')
        }
      };

      const gameState = {
        config: {
          difficulty: 'medium',
          opponentCount: 3,
          winCondition: 'points',
          pointsTarget: 500,
          theme: 'cyber',
          handle: 'Neo_Human'
        },
        engine: {
          activePlayerIndex: 0,
          playDirection: 1,
          activeColor: 'C',
          activeValue: '0',
          currentReactionTarget: null,
          reactionWindowActive: false,
          drawPile: [],
          discardPile: [],
          players: [],
          pendingDrawnCard: null,
          awaitingInput: false,
          state: STATE.STATE_GAME_INIT,
          skipNext: false,
          currentPenalty: null,
          gameOver: false
        },
        stats: {
          roundsPlayed: 0,
          startTime: null,
          pointsHistory: []
        }
      };

      const runtime = {
        logEntries: [],
        reactionTimer: null,
        processing: false
      };

      function loadProfile() {
        const saved = readStorage(STORAGE_KEYS.profile, null);
        if (saved) {
          ui.fields.handle.value = saved.handle || 'Neo_Human';
          ui.fields.palette.value = saved.palette || 'cyber';
          const played = saved.gamesPlayed || 0;
          const wins = saved.wins || 0;
          const losses = saved.losses || 0;
          const wr = played ? ((wins / played) * 100).toFixed(1) : '0.0';
          ui.profileStats.textContent = `Games Played: ${played} • Wins: ${wins} • Losses: ${losses} • Win Rate: ${wr}%`;
        } else {
          ui.fields.handle.value = 'Neo_Human';
          ui.profileStats.textContent = 'Games Played: 0 • Wins: 0 • Losses: 0 • Win Rate: 0.0%';
        }
      }

      function saveProfile(isWin) {
        const current = readStorage(STORAGE_KEYS.profile, {
          handle: gameState.config.handle,
          palette: gameState.config.theme,
          gamesPlayed: 0,
          wins: 0,
          losses: 0
        });
        current.handle = gameState.config.handle;
        current.palette = gameState.config.theme;
        current.gamesPlayed += 1;
        if (isWin) current.wins += 1;
        else current.losses += 1;
        writeStorage(STORAGE_KEYS.profile, current);
        loadProfile();
      }

      function buildDeck() {
        const deck = [];
        let id = 0;
        const add = (color, value, type, score) => {
          deck.push({ id: `hx_${id++}`, color, value: String(value), type, score });
        };

        ['C', 'M', 'Y', 'G'].forEach(color => {
          add(color, 0, 'number', 0);
          for (let n = 1; n <= 9; n += 1) {
            add(color, n, 'number', n);
            add(color, n, 'number', n);
          }
          ['UT', 'BL', 'P2'].forEach(code => {
            add(color, code, 'action', SCORE_MAP[code]);
            add(color, code, 'action', SCORE_MAP[code]);
          });
          add(color, 'FZ', 'tech', SCORE_MAP.FZ);
          add(color, 'GF', 'tech', SCORE_MAP.GF);
        });

        ['MR', 'VT', 'PL', 'MG', 'SP', 'CH'].forEach(code => {
          add('W', code, 'tech', SCORE_MAP[code]);
          add('W', code, 'tech', SCORE_MAP[code]);
        });

        return deck;
      }

      function shuffle(arr) {
        for (let p = 0; p < SHUFFLE_PASSES; p += 1) {
          for (let i = arr.length - 1; i > 0; i -= 1) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
        }
        return arr;
      }

      function createPlayers() {
        const list = [{ id: 'player_0', name: gameState.config.handle, isAI: false, hand: [], score: 0, freezeTurns: 0 }];
        for (let i = 1; i <= gameState.config.opponentCount; i += 1) {
          list.push({ id: `player_${i}`, name: `AI-${i}`, isAI: true, hand: [], score: 0, freezeTurns: 0 });
        }
        return list;
      }

      function initRound(keepScores) {
        gameState.engine.state = STATE.STATE_GAME_INIT;
        gameState.engine.drawPile = shuffle(buildDeck());
        gameState.engine.discardPile = [];
        gameState.engine.playDirection = 1;
        gameState.engine.activePlayerIndex = 0;
        gameState.engine.pendingDrawnCard = null;
        gameState.engine.currentPenalty = null;
        gameState.engine.skipNext = false;
        gameState.engine.gameOver = false;
        gameState.engine.awaitingInput = false;

        if (!keepScores || gameState.engine.players.length === 0) {
          gameState.engine.players = createPlayers();
        } else {
          gameState.engine.players.forEach(p => { p.hand = []; p.freezeTurns = 0; });
        }

        for (let c = 0; c < INITIAL_HAND_SIZE; c += 1) {
          gameState.engine.players.forEach(player => player.hand.push(drawFromPile()));
        }

        let first = drawFromPile();
        while (first && WILD_CODES.has(first.value)) {
          gameState.engine.drawPile.push(first);
          shuffle(gameState.engine.drawPile);
          first = drawFromPile();
        }

        gameState.engine.discardPile.push(first);
        gameState.engine.activeColor = first.color;
        gameState.engine.activeValue = first.value;
        gameState.engine.state = STATE.STATE_CHOOSE_TURN;
        log(`Round ${gameState.stats.roundsPlayed + 1} initialized. Baseline ${labelCard(first)}.`);
        persistSave();
        render();
        processLoop();
      }

      function drawFromPile() {
        if (gameState.engine.drawPile.length === 0) {
          if (gameState.engine.discardPile.length <= 1) return null;
          const top = gameState.engine.discardPile.pop();
          gameState.engine.drawPile = shuffle(gameState.engine.discardPile.splice(0));
          gameState.engine.discardPile.push(top);
          log('Draw pile recompiled from discard stack.');
        }
        return gameState.engine.drawPile.pop() || null;
      }

      function isPlayable(card) {
        if (!card) return false;
        if (card.color === 'W') return true;
        return card.color === gameState.engine.activeColor || card.value === gameState.engine.activeValue;
      }

      function nextIndex(fromIndex = gameState.engine.activePlayerIndex, step = 1) {
        const count = gameState.engine.players.length;
        const dir = gameState.engine.playDirection;
        return (fromIndex + dir * step + count) % count;
      }

      function processLoop() {
        if (runtime.processing || gameState.engine.gameOver) return;
        runtime.processing = true;
        setTimeout(async () => {
          try {
            await chooseTurn();
          } finally {
            runtime.processing = false;
          }
        }, 240);
      }

      async function chooseTurn() {
        gameState.engine.state = STATE.STATE_CHOOSE_TURN;
        const player = gameState.engine.players[gameState.engine.activePlayerIndex];
        render();

        if (player.freezeTurns > 0) {
          player.freezeTurns -= 1;
          log(`${player.name} is frozen and skips a turn.`);
          return afterAction(player);
        }

        if (player.isAI) {
          gameState.engine.state = STATE.STATE_AI_TURN;
          await aiTurn(player);
        } else {
          gameState.engine.state = STATE.STATE_PLAYER_TURN;
          gameState.engine.awaitingInput = true;
          ui.statusLine.textContent = 'Your action window: play any valid card or draw.';
          render();
        }
      }

      async function aiTurn(player) {
        await sleep(500 + Math.random() * 550);
        const playable = player.hand
          .map((card, index) => ({ card, index }))
          .filter(x => isPlayable(x.card));

        if (playable.length === 0) {
          const drawn = drawFromPile();
          if (drawn) {
            player.hand.push(drawn);
            log(`${player.name} draws 1 card.`);
            if (isPlayable(drawn) && Math.random() < (gameState.config.difficulty === 'easy' ? EASY_DRAW_PLAY_PROBABILITY : STANDARD_DRAW_PLAY_PROBABILITY)) {
              player.hand.pop();
              await playCard(gameState.engine.activePlayerIndex, drawn, player.hand.length, true);
              return;
            }
          }
          return afterAction(player);
        }

        const choice = pickAICard(player, playable);
        await playCard(gameState.engine.activePlayerIndex, choice.card, choice.index, true);
      }

      function pickAICard(player, playable) {
        if (gameState.config.difficulty === 'easy') {
          return playable[Math.floor(Math.random() * playable.length)];
        }

        const leaderThreat = gameState.engine.players.some(p => p.id !== player.id && p.hand.length <= 2);
        const coeff = gameState.config.difficulty === 'hard' ? { a: 1.2, b: 1.5, c: 1.0 } : { a: 1.0, b: 0.5, c: 0.5 };
        const colorCounts = player.hand.reduce((acc, c) => {
          acc[c.color] = (acc[c.color] || 0) + 1;
          return acc;
        }, {});

        let best = playable[0];
        let bestWeight = -Infinity;

        playable.forEach(entry => {
          const card = entry.card;
          const sPoints = card.score;
          let disrupt = 0;
          if (['BL', 'P2', 'FZ', 'MG', 'VT', 'CH'].includes(card.value)) disrupt = leaderThreat ? 30 : 14;
          if (card.value === 'MR') disrupt = 8;
          const sync = colorCounts[card.color] || 0;
          const weight = sPoints * coeff.a + disrupt * coeff.b + sync * coeff.c + Math.random();
          if (weight > bestWeight) {
            bestWeight = weight;
            best = entry;
          }
        });

        return best;
      }

      async function playCard(playerIndex, card, handIndex, fromDrawn) {
        const player = gameState.engine.players[playerIndex];
        if (!isPlayable(card) && !fromDrawn) return;

        if (typeof handIndex === 'number') {
          player.hand.splice(handIndex, 1);
        }

        gameState.engine.discardPile.push(card);
        gameState.engine.activeValue = card.value;
        gameState.engine.activeColor = card.color;

        if (card.color === 'W') {
          const chosen = await chooseWildColor(playerIndex);
          gameState.engine.activeColor = chosen;
        }

        log(`${player.name} played ${labelCard(card)}.`);
        gameState.engine.state = STATE.STATE_APPLY_CARD_FX;
        await applyCardEffects(card, playerIndex);

        if (gameState.engine.gameOver) return;
        afterAction(player);
      }

      async function applyCardEffects(card, actorIndex) {
        const actor = gameState.engine.players[actorIndex];
        const target = nextIndex(actorIndex);

        switch (card.value) {
          case 'UT':
            gameState.engine.playDirection *= -1;
            log('U-Turn engaged. Play direction reversed.');
            break;
          case 'BL':
            gameState.engine.skipNext = true;
            log(`${gameState.engine.players[target].name} will be blocked.`);
            break;
          case 'P2':
            await resolvePenalty(actorIndex, target, { type: 'P2', amount: 2 });
            break;
          case 'FZ':
            await resolvePenalty(actorIndex, target, { type: 'FZ', amount: 2 });
            break;
          case 'MG':
            await resolvePenalty(actorIndex, target, { type: 'MG' });
            break;
          case 'GF':
            await applyGift(actorIndex, target);
            break;
          case 'VT':
            applyVortex();
            break;
          case 'PL':
            applyPulse(actorIndex);
            break;
          case 'SP':
            await applySpy(actorIndex);
            break;
          case 'CH':
            applyChaos(actorIndex);
            break;
          default:
            break;
        }

        if (actor.hand.length === 0) {
          await roundOver(actorIndex);
        }
      }

      async function resolvePenalty(actorIndex, initialTarget, penalty) {
        let target = initialTarget;
        let depth = 0;

        while (depth < gameState.engine.players.length + MAX_REFLECTION_CHAIN_BUFFER) {
          const reflected = await reactionMirrorCheck(target, penalty);
          if (!reflected) break;
          target = nextIndex(target);
          depth += 1;
        }

        const targetPlayer = gameState.engine.players[target];
        if (penalty.type === 'P2') {
          for (let i = 0; i < penalty.amount; i += 1) {
            const card = drawFromPile();
            if (card) targetPlayer.hand.push(card);
          }
          log(`${targetPlayer.name} receives +${penalty.amount} cards.`);
        } else if (penalty.type === 'FZ') {
          targetPlayer.freezeTurns += penalty.amount;
          log(`${targetPlayer.name} frozen for ${penalty.amount} turns.`);
        } else if (penalty.type === 'MG') {
          await applyMagnet(target);
        }

        if (targetPlayer.hand.length === 0) {
          await roundOver(target);
        }
      }

      async function reactionMirrorCheck(targetIndex, penalty) {
        const target = gameState.engine.players[targetIndex];
        const mirrorIndex = target.hand.findIndex(c => c.value === 'MR');
        if (mirrorIndex < 0) return false;

        gameState.engine.reactionWindowActive = true;
        gameState.engine.currentReactionTarget = targetIndex;
        render();

        let useMirror = false;
        if (target.isAI) {
          const chance = gameState.config.difficulty === 'easy' ? 0.55 : (gameState.config.difficulty === 'medium' ? 0.8 : 0.98);
          useMirror = Math.random() < chance;
          await sleep(650);
        } else {
          useMirror = await promptMirrorChoice(penalty);
        }

        gameState.engine.reactionWindowActive = false;
        gameState.engine.currentReactionTarget = null;

        if (useMirror) {
          const mirror = target.hand.splice(mirrorIndex, 1)[0];
          gameState.engine.discardPile.push(mirror);
          gameState.engine.activeColor = 'W';
          gameState.engine.activeValue = 'MR';
          log(`${target.name} deployed Mirror. Penalty reflected.`);
          render();
          return true;
        }

        return false;
      }

      function promptMirrorChoice(penalty) {
        return new Promise(resolve => {
          let seconds = MIRROR_REACTION_SECONDS;
          const modal = document.createElement('div');
          modal.className = 'modal';
          modal.innerHTML = `
            <h3 style="margin-bottom:8px">Reaction Window: Mirror</h3>
            <p class="small" style="margin-bottom:8px">Incoming ${penalty.type} penalty detected. Reflect to next player?</p>
            <p class="countdown" id="mirror-count">${seconds.toFixed(1)}s</p>
            <div class="actions">
              <button id="mirror-yes" class="primary">Play Mirror</button>
              <button id="mirror-no">Take Penalty</button>
            </div>
          `;
          openModal(modal);

          const yes = modal.querySelector('#mirror-yes');
          const no = modal.querySelector('#mirror-no');
          const count = modal.querySelector('#mirror-count');

          const finish = value => {
            clearInterval(runtime.reactionTimer);
            closeModal();
            resolve(value);
          };

          yes.onclick = () => finish(true);
          no.onclick = () => finish(false);

          runtime.reactionTimer = setInterval(() => {
            seconds -= 0.1;
            count.textContent = `${Math.max(0, seconds).toFixed(1)}s`;
            if (seconds <= 0) finish(false);
          }, 100);
        });
      }

      async function applyMagnet(targetIndex) {
        const player = gameState.engine.players[targetIndex];
        log(`Magnet locked ${player.name}. Drawing until ${COLOR_META[gameState.engine.activeColor].name}.`);
        while (true) {
          const card = drawFromPile();
          if (!card) break;
          if (card.color === gameState.engine.activeColor) {
            gameState.engine.discardPile.push(card);
            gameState.engine.activeValue = card.value;
            log(`${player.name} satisfied Magnet with ${labelCard(card)}.`);
            break;
          }
          player.hand.push(card);
        }
      }

      async function applyGift(actorIndex, targetIndex) {
        const actor = gameState.engine.players[actorIndex];
        if (!actor.hand.length) return;

        let pick = 0;
        if (!actor.isAI) {
          pick = await promptGiftPick(actor.hand);
        } else {
          pick = actor.hand.reduce((maxI, c, i) => (c.score > actor.hand[maxI].score ? i : maxI), 0);
        }

        const [gift] = actor.hand.splice(pick, 1);
        gameState.engine.players[targetIndex].hand.push(gift);
        log(`${actor.name} transferred ${labelCard(gift)} to ${gameState.engine.players[targetIndex].name}.`);
      }

      function promptGiftPick(hand) {
        return new Promise(resolve => {
          const modal = document.createElement('div');
          modal.className = 'modal';
          modal.innerHTML = '<h3>Select a card to donate</h3><p class="small" style="margin-bottom:8px">Gift sends one card to next player.</p>';
          const wrap = document.createElement('div');
          wrap.style.display = 'flex';
          wrap.style.gap = '6px';
          wrap.style.overflowX = 'auto';
          hand.forEach((card, i) => {
            const b = document.createElement('button');
            b.className = 'card-btn';
            b.innerHTML = hexCardSVG(card);
            b.onclick = () => {
              closeModal();
              resolve(i);
            };
            wrap.appendChild(b);
          });
          modal.appendChild(wrap);
          openModal(modal);
        });
      }

      function applyVortex() {
        const players = gameState.engine.players;
        const hands = players.map(p => p.hand);
        const shifted = [];
        for (let i = 0; i < players.length; i += 1) {
          shifted[nextIndex(i)] = hands[i];
        }
        players.forEach((p, i) => { p.hand = shifted[i] || []; });
        log('Vortex executed. All hands rotated.');
      }

      function applyPulse(actorIndex) {
        gameState.engine.players.forEach((p, i) => {
          if (i === actorIndex) return;
          const card = drawFromPile();
          if (card) p.hand.push(card);
        });
        log('Pulse emitted. All opponents draw 1 card.');
      }

      async function applySpy(actorIndex) {
        const candidates = gameState.engine.players
          .map((p, i) => ({ p, i }))
          .filter(x => x.i !== actorIndex)
          .sort((a, b) => a.p.hand.length - b.p.hand.length);
        if (!candidates.length) return;
        const target = candidates[0];
        const actor = gameState.engine.players[actorIndex];
        log(`${actor.name} used Spy on ${target.p.name}.`);

        if (!actor.isAI) {
          const modal = document.createElement('div');
          modal.className = 'modal';
          modal.innerHTML = `<h3>Spy View: ${target.p.name}</h3><p class="small" style="margin-bottom:8px">Visible for up to 5 seconds.</p>`;
          const list = document.createElement('div');
          list.style.display = 'flex';
          list.style.gap = '6px';
          list.style.overflowX = 'auto';
          target.p.hand.forEach(card => {
            const d = document.createElement('div');
            d.innerHTML = hexCardSVG(card);
            list.appendChild(d);
          });
          modal.appendChild(list);
          openModal(modal);
          await sleep(SPY_VIEW_DURATION_MS);
          closeModal();
        }
      }

      function applyChaos(actorIndex) {
        const players = gameState.engine.players;
        const totalCards = players.reduce((sum, p) => sum + p.hand.length, 0);
        const chaos = [];
        players.forEach(p => {
          while (p.hand.length) chaos.push(p.hand.pop());
        });
        shuffle(chaos);

        let current = actorIndex;
        while (chaos.length) {
          players[current].hand.push(chaos.pop());
          current = nextIndex(current);
        }

        if (players.reduce((sum, p) => sum + p.hand.length, 0) !== totalCards) {
          log('Chaos distribution mismatch detected.');
        }
        log('Chaos protocol complete. Hands redistributed.');
      }

      function afterAction(player) {
        gameState.engine.state = STATE.STATE_CHECK_VICTORY;
        if (player.hand.length === 0) {
          roundOver(gameState.engine.activePlayerIndex);
          return;
        }

        let next = nextIndex();
        if (gameState.engine.skipNext) {
          log(`${gameState.engine.players[next].name} is blocked.`);
          next = nextIndex(next);
          gameState.engine.skipNext = false;
        }

        gameState.engine.activePlayerIndex = next;
        gameState.engine.pendingDrawnCard = null;
        gameState.engine.awaitingInput = false;
        persistSave();
        render();
        processLoop();
      }

      async function roundOver(winnerIndex) {
        gameState.engine.state = STATE.STATE_ROUND_OVER;
        gameState.engine.awaitingInput = false;

        const winner = gameState.engine.players[winnerIndex];
        let points = 0;
        gameState.engine.players.forEach((p, i) => {
          if (i !== winnerIndex) {
            points += p.hand.reduce((s, c) => s + c.score, 0);
          }
        });

        winner.score += points;
        gameState.stats.roundsPlayed += 1;
        gameState.stats.pointsHistory.push({ round: gameState.stats.roundsPlayed, winner: winner.name, points });
        log(`Round over. ${winner.name} gains ${points} points.`);
        updateHighScores(winner.name, winner.score);

        if (gameState.config.winCondition === 'single') {
          endMatch(winnerIndex);
          return;
        }

        const target = gameState.config.pointsTarget;
        const championIndex = gameState.engine.players.findIndex(p => p.score >= target);
        if (championIndex >= 0) {
          endMatch(championIndex);
          return;
        }

        await sleep(1200);
        initRound(true);
      }

      function endMatch(championIndex) {
        gameState.engine.gameOver = true;
        const champ = gameState.engine.players[championIndex];
        log(`Match complete. Champion: ${champ.name}.`);
        saveProfile(championIndex === 0);
        clearSavedGame();
        render();
      }

      function updateHighScores(name, score) {
        const list = readStorage(STORAGE_KEYS.highs, []);
        list.push({ name, score, ts: Date.now() });
        list.sort((a, b) => b.score - a.score);
        writeStorage(STORAGE_KEYS.highs, list.slice(0, 12));
      }

      function leaderSummaryText() {
        const scores = [...gameState.engine.players]
          .sort((a, b) => b.score - a.score)
          .map(p => `${p.name}: ${p.score}`)
          .join(' • ');
        return scores || 'No scores yet';
      }

      function handleHumanDraw() {
        if (!gameState.engine.awaitingInput) return;
        const player = gameState.engine.players[0];
        const card = drawFromPile();
        if (!card) return;
        player.hand.push(card);
        gameState.engine.pendingDrawnCard = card.id;
        log(`You drew ${labelCard(card)}.`);
        ui.playDrawnBtn.disabled = !isPlayable(card);
        ui.passBtn.disabled = false;
        gameState.engine.state = STATE.STATE_EVALUATE_OPTIONS;
        render();
      }

      async function handlePlayDrawn() {
        const player = gameState.engine.players[0];
        const idx = player.hand.findIndex(c => c.id === gameState.engine.pendingDrawnCard);
        if (idx < 0) return;
        const card = player.hand[idx];
        if (!isPlayable(card)) return;
        player.hand.splice(idx, 1);
        await playCard(0, card, null, true);
      }

      function handlePass() {
        if (!gameState.engine.awaitingInput) return;
        const player = gameState.engine.players[0];
        log(`${player.name} passes turn.`);
        afterAction(player);
      }

      async function handleHumanCardPlay(index) {
        if (!gameState.engine.awaitingInput) return;
        const player = gameState.engine.players[0];
        const card = player.hand[index];
        if (!isPlayable(card)) return;
        await playCard(0, card, index, false);
      }

      async function chooseWildColor(playerIndex) {
        const player = gameState.engine.players[playerIndex];
        if (player.isAI) {
          const counts = { C: 0, M: 0, Y: 0, G: 0 };
          player.hand.forEach(card => { if (counts[card.color] !== undefined) counts[card.color] += 1; });
          return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0] || 'C';
        }

        return new Promise(resolve => {
          const modal = document.createElement('div');
          modal.className = 'modal';
          modal.innerHTML = '<h3>Select Active Color</h3><p class="small">Wild Tech card requires color lock.</p>';
          const choices = document.createElement('div');
          choices.id = 'color-choices';
          ['C', 'M', 'Y', 'G'].forEach(code => {
            const b = document.createElement('button');
            b.className = 'color-pick';
            b.style.background = COLOR_META[code].css;
            b.style.color = code === 'Y' ? '#111' : '#fff';
            b.textContent = COLOR_META[code].name.toUpperCase();
            b.onclick = () => {
              closeModal();
              resolve(code);
            };
            choices.appendChild(b);
          });
          modal.appendChild(choices);
          openModal(modal);
        });
      }

      function hexCardSVG(card, isBack = false) {
        if (isBack) {
          return `
            <svg class="hex-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <polygon points="180,100 140,169.3 60,169.3 20,100 60,30.7 140,30.7" fill="#152443" stroke="#3e5d97" stroke-width="4"/>
              <polygon points="172,100 134,162.4 66,162.4 28,100 66,37.6 134,37.6" fill="#1f2f52" stroke="#7db0ff" stroke-width="1" stroke-dasharray="8,4"/>
              <text x="100" y="108" text-anchor="middle" font-size="22" fill="#c7dcff" font-weight="900">HX</text>
            </svg>`;
        }

        const color = COLOR_META[card.color]?.css || '#fff';
        const label = card.value;
        const top = card.value;

        return `
          <svg class="hex-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="${labelCard(card)}">
            <defs>
              <linearGradient id="grad_${card.id}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="${color}"/>
                <stop offset="100%" stop-color="#0d2147"/>
              </linearGradient>
              <filter id="shadow_${card.id}" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="${color}" flood-opacity="0.6"/>
              </filter>
            </defs>
            <polygon points="180,100 140,169.3 60,169.3 20,100 60,30.7 140,30.7" fill="#101828" stroke="url(#grad_${card.id})" stroke-width="4" filter="url(#shadow_${card.id})"/>
            <polygon points="172,100 134,162.4 66,162.4 28,100 66,37.6 134,37.6" fill="#1a2238" stroke="${color}" stroke-width="1" stroke-dasharray="8,4"/>
            <circle cx="100" cy="100" r="29" fill="#111625" stroke="${color}" stroke-width="2"/>
            <text x="100" y="111" text-anchor="middle" font-size="30" fill="#fff" font-weight="900">${label}</text>
            <text x="56" y="56" text-anchor="middle" font-size="12" fill="${color}" font-weight="700">${top}</text>
            <circle cx="180" cy="100" r="3" fill="${color}"/>
            <circle cx="20" cy="100" r="3" fill="${color}"/>
          </svg>
        `;
      }

      function labelCard(card) {
        const color = COLOR_META[card.color]?.name || card.color;
        return card.color === 'W' ? `${card.value}` : `${color} ${card.value}`;
      }

      function render() {
        const eng = gameState.engine;
        const players = eng.players;
        if (!players.length) return;

        ui.drawCount.textContent = `${eng.drawPile.length} cards`;
        const top = eng.discardPile[eng.discardPile.length - 1];
        ui.discardCard.innerHTML = top ? hexCardSVG(top) : '';
        ui.discardMeta.textContent = top ? `${labelCard(top)}` : '-';
        ui.activePill.textContent = `Active: ${COLOR_META[eng.activeColor]?.name || '-'} / ${eng.activeValue}`;
        ui.turnPill.textContent = `Turn: ${players[eng.activePlayerIndex]?.name || '-'}`;
        ui.roundPill.textContent = `Round: ${Math.max(1, gameState.stats.roundsPlayed + 1)}`;
        ui.leaderboardSummary.textContent = leaderSummaryText();

        ui.opponents.innerHTML = '';
        players.forEach((player, index) => {
          const chip = document.createElement('div');
          chip.className = `player-chip ${index === eng.activePlayerIndex ? 'active' : ''}`;
          chip.innerHTML = `
            <div class="name">${player.name}${player.isAI ? '' : ' (You)'}</div>
            <div class="meta">Hand: ${player.hand.length} • Score: ${player.score}</div>
            <div class="meta">Freeze: ${player.freezeTurns} • ${index === eng.currentReactionTarget ? 'Reaction Window' : 'Ready'}</div>
          `;
          ui.opponents.appendChild(chip);
        });

        ui.hand.innerHTML = '';
        const human = players[0];
        human.hand.forEach((card, index) => {
          const btn = document.createElement('button');
          const playable = isPlayable(card) && eng.awaitingInput && eng.activePlayerIndex === 0;
          btn.className = `card-btn ${playable ? 'playable' : 'unplayable'}`;
          btn.innerHTML = hexCardSVG(card);
          btn.disabled = !playable;
          btn.onclick = () => handleHumanCardPlay(index);
          ui.hand.appendChild(btn);
        });

        const humanTurn = eng.awaitingInput && eng.activePlayerIndex === 0 && !eng.gameOver;
        ui.drawBtn.disabled = !humanTurn;
        ui.playDrawnBtn.disabled = !(humanTurn && human.hand.some(c => c.id === eng.pendingDrawnCard && isPlayable(c)));
        ui.passBtn.disabled = !(humanTurn && !!eng.pendingDrawnCard);
      }

      function log(msg) {
        runtime.logEntries.unshift(`[${new Date().toLocaleTimeString()}] ${msg}`);
        runtime.logEntries = runtime.logEntries.slice(0, 40);
        ui.log.innerHTML = runtime.logEntries.map(line => `<div>${escapeHtml(line)}</div>`).join('');
        ui.statusLine.textContent = msg;
      }

      function readStorage(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }

      function writeStorage(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
      }

      function persistSave() {
        writeStorage(STORAGE_KEYS.save, {
          config: gameState.config,
          engine: {
            activePlayerIndex: gameState.engine.activePlayerIndex,
            playDirection: gameState.engine.playDirection,
            activeColor: gameState.engine.activeColor,
            activeValue: gameState.engine.activeValue,
            currentReactionTarget: gameState.engine.currentReactionTarget,
            reactionWindowActive: gameState.engine.reactionWindowActive,
            drawPile: gameState.engine.drawPile,
            discardPile: gameState.engine.discardPile,
            players: gameState.engine.players,
            pendingDrawnCard: gameState.engine.pendingDrawnCard,
            skipNext: gameState.engine.skipNext
          },
          stats: gameState.stats,
          logs: runtime.logEntries
        });
      }

      function clearSavedGame() {
        try { localStorage.removeItem(STORAGE_KEYS.save); } catch {}
      }

      function restoreSavedGame() {
        const saved = readStorage(STORAGE_KEYS.save, null);
        if (!saved || !saved.engine || !saved.engine.players) {
          log('No saved session detected.');
          return false;
        }

        gameState.config = saved.config;
        gameState.engine = {
          ...gameState.engine,
          ...saved.engine,
          awaitingInput: false,
          state: STATE.STATE_CHOOSE_TURN,
          gameOver: false
        };
        gameState.stats = saved.stats || gameState.stats;
        runtime.logEntries = saved.logs || [];
        applyPalette(gameState.config.theme);
        ui.setup.classList.add('hidden');
        ui.game.classList.remove('hidden');
        render();
        processLoop();
        return true;
      }

      function applyPalette(name) {
        const root = document.documentElement;
        if (name === 'violet') {
          root.style.setProperty('--accent', '#b779ff');
          root.style.setProperty('--c', '#7cd9ff');
          root.style.setProperty('--m', '#ff6ce4');
          root.style.setProperty('--y', '#ffe07a');
          root.style.setProperty('--g', '#95ffb7');
        } else if (name === 'emerald') {
          root.style.setProperty('--accent', '#4effb8');
          root.style.setProperty('--c', '#58f0c9');
          root.style.setProperty('--m', '#4ed3ff');
          root.style.setProperty('--y', '#ebff63');
          root.style.setProperty('--g', '#42ff7c');
        } else if (name === 'mono') {
          root.style.setProperty('--accent', '#d2e3ff');
          root.style.setProperty('--c', '#a9bfd8');
          root.style.setProperty('--m', '#b8c9df');
          root.style.setProperty('--y', '#d6dde8');
          root.style.setProperty('--g', '#93acc7');
        } else {
          root.style.setProperty('--accent', '#00f3ff');
          root.style.setProperty('--c', '#00f3ff');
          root.style.setProperty('--m', '#ff4ecf');
          root.style.setProperty('--y', '#ffd44d');
          root.style.setProperty('--g', '#59ff89');
        }
      }

      function openModal(node) {
        ui.modalLayer.innerHTML = '';
        ui.modalLayer.appendChild(node);
        ui.modalLayer.classList.remove('hidden');
      }

      function closeModal() {
        ui.modalLayer.classList.add('hidden');
        ui.modalLayer.innerHTML = '';
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function escapeHtml(s) {
        return s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
      }

      function startNewMatch() {
        gameState.config = {
          difficulty: ui.fields.difficulty.value,
          opponentCount: Math.min(7, Math.max(1, Number(ui.fields.opponents.value) || 3)),
          winCondition: ui.fields.winCondition.value,
          pointsTarget: Number(ui.fields.pointsTarget.value) || 500,
          theme: ui.fields.palette.value,
          handle: (ui.fields.handle.value || 'Neo_Human').trim().slice(0, 20)
        };

        ui.fields.opponents.value = gameState.config.opponentCount;
        applyPalette(gameState.config.theme);
        gameState.stats = { roundsPlayed: 0, startTime: Date.now(), pointsHistory: [] };

        ui.setup.classList.add('hidden');
        ui.game.classList.remove('hidden');

        runtime.logEntries = [];
        initRound(false);
      }

      ui.startBtn.addEventListener('click', startNewMatch);
      ui.loadBtn.addEventListener('click', () => {
        if (!restoreSavedGame()) {
          alert('No saved HexaTech session available.');
        }
      });
      ui.drawBtn.addEventListener('click', handleHumanDraw);
      ui.playDrawnBtn.addEventListener('click', handlePlayDrawn);
      ui.passBtn.addEventListener('click', handlePass);
      ui.saveBtn.addEventListener('click', () => {
        persistSave();
        log('Session snapshot saved.');
      });
      ui.newMatchBtn.addEventListener('click', () => {
        clearSavedGame();
        location.reload();
      });
      ui.resetScoresBtn.addEventListener('click', () => {
        writeStorage(STORAGE_KEYS.highs, []);
        log('High score table reset.');
      });

      loadProfile();
      applyPalette(ui.fields.palette.value);
      log('HexaTech idle. Configure launch parameters.');
    })();
  </script>
</body>
</html>
